<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FNTD 2 Upgrader</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; user-select: none; }
        body { background: #0e1015; color: #fff; display: flex; flex-direction: column; align-items: center; padding: 12px; min-height: 100vh; }

        .header { width: 100%; max-width: 420px; display: flex; justify-content: space-between; align-items: center; background: #161a23; border: 1px solid #2a313d; padding: 10px; border-radius: 12px; margin-bottom: 12px; }
        .nick-box { display: flex; flex-direction: column; width: 70%; }
        .nick-label { font-size: 10px; color: #ffaa00; font-weight: bold; margin-bottom: 2px; }
        .nick-input { background: #12151c; border: 1px solid #3a4454; color: #00ffcc; padding: 6px 10px; border-radius: 6px; outline: none; font-weight: bold; font-size: 13px; }
        .avatar-container { width: 48px; height: 48px; border-radius: 50%; border: 2px solid #ffaa00; overflow: hidden; background: #12151c; display: flex; align-items: center; justify-content: center; }
        .avatar-container img { width: 100%; height: 100%; object-fit: cover; }

        .bet-type-selector { display: flex; gap: 8px; width: 100%; max-width: 420px; margin-bottom: 10px; }
        .type-btn { flex: 1; padding: 8px; background: #181d26; border: 1px solid #2d3645; color: #888; font-size: 11px; font-weight: bold; text-align: center; border-radius: 6px; cursor: pointer; text-transform: uppercase; }
        .type-btn.active { background: #2ea043; color: #fff; border-color: #2ea043; }

        .souls-slider-box { display: none; width: 100%; max-width: 420px; background: #161b24; border: 1px solid #2ea043; padding: 10px; border-radius: 10px; margin-bottom: 12px; text-align: center; }
        .souls-slider-box label { font-size: 12px; font-weight: bold; color: #00ffcc; display: block; margin-bottom: 6px; }
        .souls-slider-box input { width: 100%; accent-color: #00ffcc; cursor: pointer; }

        .slots-wrapper { display: flex; gap: 10px; width: 100%; max-width: 420px; margin-bottom: 12px; }
        .slot-card { flex: 1; background: #161b24; border: 1px solid #2d3645; border-radius: 10px; padding: 8px; text-align: center; height: 100px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .slot-card.bet { border-color: #2ea043; }
        .slot-card.target { border-color: #ff3355; }
        .slot-img { width: 42px; height: 42px; object-fit: contain; }
        .slot-name { font-size: 10px; font-weight: bold; margin-top: 4px; color: #ddd; }

        .wheel-box { position: relative; width: 180px; height: 180px; margin: 10px 0; display: flex; align-items: center; justify-content: center; }
        .pointer-top { position: absolute; top: -8px; left: 50%; transform: translateX(-50%); width: 0; height: 0; border-left: 8px solid transparent; border-right: 8px solid transparent; border-top: 15px solid #ffcc00; z-index: 10; }
        canvas { border-radius: 50%; box-shadow: 0 0 20px rgba(0,0,0,0.8); transition: transform 4s cubic-bezier(0.15, 0.9, 0.15, 1); }
        .chance-center { position: absolute; width: 55px; height: 55px; background: #0c0e12; border: 2px solid #ffcc00; border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center; font-weight: bold; font-size: 14px; color: #fff; }

        .grid-header { width: 100%; max-width: 420px; font-size: 11px; color: #7a8b9e; font-weight: bold; text-transform: uppercase; margin-bottom: 6px; }
        .items-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; width: 100%; max-width: 420px; max-height: 160px; overflow-y: auto; background: #12151c; border: 1px solid #262c38; padding: 8px; border-radius: 10px; margin-bottom: 12px; }
        .grid-item { background: #181d26; border: 1px solid #2d3645; border-radius: 6px; padding: 5px; text-align: center; cursor: pointer; }
        .grid-item:hover { border-color: #ffaa00; }
        .grid-item img { width: 32px; height: 32px; object-fit: contain; }
        .grid-item p { font-size: 9px; font-weight: bold; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #bbb; }

        .action-btn { width: 100%; max-width: 420px; padding: 14px; background: linear-gradient(180deg, #ffaa00 0%, #e67300 100%); border: none; border-radius: 8px; color: #000; font-size: 16px; font-weight: 900; cursor: pointer; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.92); flex-direction: column; align-items: center; justify-content: center; z-index: 100; padding: 15px; }
        .modal-card { background: #161b24; border: 1px solid #2d3645; padding: 20px; border-radius: 12px; max-width: 380px; width: 100%; text-align: center; }
    </style>
</head>
<body>

    <div class="header">
        <div class="nick-box">
            <span class="nick-label">ROBLOX НИКНЕЙМ</span>
            <input type="text" id="robloxNick" class="nick-input" placeholder="Введите ник..." oninput="onNickChange()">
        </div>
        <div class="avatar-container">
            <img id="userAvatar" src="https://tr.rbxcdn.com/30day-avatar-headshot-png/150/150/AvatarHeadshot/Png/noFilter">
        </div>
    </div>

    <div class="bet-type-selector">
        <div class="type-btn active" id="btnBetUnit" onclick="setBetType('unit')">Ставить Юнита</div>
        <div class="type-btn" id="btnBetSouls" onclick="setBetType('souls')">Ставить Души</div>
    </div>

    <div class="souls-slider-box" id="soulsBox">
        <label>Ставка: <span id="soulsVal">500</span> Souls</label>
        <input type="range" id="soulsRange" min="100" max="4000" step="100" value="500" oninput="onSoulsSliderChange(this.value)">
    </div>

    <div class="slots-wrapper">
        <div class="slot-card bet">
            <img id="imgBet" class="slot-img">
            <div id="titleBet" class="slot-name"></div>
        </div>
        <div class="slot-card target">
            <img id="imgTarget" class="slot-img">
            <div id="titleTarget" class="slot-name"></div>
        </div>
    </div>

    <div class="wheel-box">
        <div class="pointer-top"></div>
        <div class="chance-center"><div id="chanceNum">0%</div></div>
        <canvas id="wheelCanvas" width="180" height="180"></canvas>
    </div>

    <div class="grid-header">Выберите цель апгрейда (Только Юниты):</div>
    <div class="items-grid" id="itemsGrid"></div>

    <button class="action-btn" onclick="startUpgradeProcess()">СДЕЛАТЬ АПГРЕЙД</button>

    <!-- УВЕДОМЛЕНИЕ О ДОСТАВКЕ ПРИЗА (ДЛЯ ОФЛАЙНА) -->
    <div class="modal" id="prizeDeliveredModal">
        <div class="modal-card" style="border-color: #2ea043;">
            <h2 style="color:#2ea043; font-size:20px; margin-bottom:10px;">🎉 ПРИЗ ДОСТАВЛЕН!</h2>
            <p style="color:#aaa; font-size:13px; margin-bottom:15px;">ВАШ ПРИЗ УСПЕШНО ДОСТАВЛЕН:</p>
            <div id="deliveredPrizeName" style="background:#111; color:#ffaa00; font-size:16px; font-weight:bold; padding:12px; border-radius:8px; margin-bottom:15px; border:1px solid #ffaa00;"></div>
            <button class="action-btn" onclick="closePrizeModal()">ОТЛИЧНО!</button>
        </div>
    </div>

    <div class="modal" id="payModal">
        <div class="modal-card">
            <h3 style="color:#ffaa00;">ПОЧТОВЫЙ ПЕРЕВОД</h3>
            <p style="color:#aaa; font-size:12px; margin-top:6px;">Отправьте вашу ставку по почте на ник:</p>
            <div style="background:#000; color:#ffcc00; font-size:18px; font-weight:bold; padding:8px; border-radius:6px; margin:12px 0;">fntd2UPGRADER</div>
            <button class="action-btn" onclick="confirmPayment()">Я ОТПРАВИЛ!</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        const userId = tg.initDataUnsafe?.user?.id || Math.floor(Math.random()*1000000);

        // ИКОНКА ДУШ И ЮНИТА
        const SOULS_IMG = "https://i.ibb.co/L53pG8F/souls.png";
        const WITHERED_BONNIE_IMG = "https://share.google/Ef0dw4vwR5OK8OFwv";

        const UNITS_LIST = [
            { name: "Sole Survivor Withered Bonnie", val: 150000, img: WITHERED_BONNIE_IMG }
        ];

        let betType = 'unit';
        let currentBet = UNITS_LIST[0];
        let currentTarget = UNITS_LIST[0];
        let chance = 0;
        let activePrizeId = null;

        // ПРОВЕРКА БАЗЫ ДАННЫХ ПРИ СТАРТЕ
        async function loadUserData() {
            try {
                const res = await fetch(`/api/user_info/${userId}`);
                const data = await res.json();
                
                // Восстанавливаем сохраненный ник
                if(data.roblox_nick) {
                    document.getElementById('robloxNick').value = data.roblox_nick;
                    updateAvatar(data.roblox_nick);
                }

                // Проверяем, был ли выдан приз пока игрок был оффлайн
                if(data.delivered_prize) {
                    activePrizeId = data.delivered_prize.id;
                    document.getElementById('deliveredPrizeName').innerText = data.delivered_prize.name;
                    document.getElementById('prizeDeliveredModal').style.display = 'flex';
                }
            } catch(e) {}
        }

        async function closePrizeModal() {
            document.getElementById('prizeDeliveredModal').style.display = 'none';
            if(activePrizeId) {
                await fetch('/api/claim_prize_notification', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ prize_id: activePrizeId })
                });
            }
        }

        let nickTimeout;
        function onNickChange() {
            const nick = document.getElementById('robloxNick').value.trim();
            clearTimeout(nickTimeout);
            nickTimeout = setTimeout(() => {
                updateAvatar(nick);
                // Сохраняем в БД
                fetch(`/api/user_info/${userId}`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ roblox_nick: nick })
                });
            }, 600);
        }

        async function updateAvatar(nick) {
            if(!nick) return;
            try {
                const proxy = "https://corsproxy.io/?";
                const userRes = await fetch(proxy + encodeURIComponent("https://users.roblox.com/v1/usernames/users"), {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({usernames: [nick], excludeBannedUsers: true})
                });
                const userData = await userRes.json();
                if(userData.data?.[0]?.id) {
                    const uid = userData.data[0].id;
                    const thumbRes = await fetch(proxy + encodeURIComponent(`https://thumbnails.roblox.com/v1/users/avatar-headshot?userIds=${uid}&size=150x150&format=Png&isCircular=true`));
                    const thumbData = await thumbRes.json();
                    if(thumbData.data?.[0]?.imageUrl) {
                        document.getElementById('userAvatar').src = thumbData.data[0].imageUrl;
                    }
                }
            } catch(e) {}
        }

        function setBetType(type) {
            betType = type;
            document.getElementById('btnBetUnit').className = 'type-btn ' + (type === 'unit' ? 'active' : '');
            document.getElementById('btnBetSouls').className = 'type-btn ' + (type === 'souls' ? 'active' : '');
            
            if(type === 'souls') {
                document.getElementById('soulsBox').style.display = 'block';
                const sVal = parseInt(document.getElementById('soulsRange').value);
                currentBet = { name: `${sVal} Souls`, val: sVal, img: SOULS_IMG };
            } else {
                document.getElementById('soulsBox').style.display = 'none';
                currentBet = UNITS_LIST[0];
            }
            updateSlots();
        }

        function onSoulsSliderChange(val) {
            document.getElementById('soulsVal').innerText = val;
            currentBet = { name: `${val} Souls`, val: parseInt(val), img: SOULS_IMG };
            updateSlots();
        }

        function renderGrid() {
            const grid = document.getElementById('itemsGrid');
            grid.innerHTML = '';
            UNITS_LIST.forEach(item => {
                const card = document.createElement('div');
                card.className = 'grid-item';
                card.innerHTML = `<img src="${item.img}" onerror="this.src='${SOULS_IMG}'"><p>${item.name}</p>`;
                card.onclick = () => {
                    currentTarget = item;
                    updateSlots();
                };
                grid.appendChild(card);
            });
        }

        function updateSlots() {
            document.getElementById('imgBet').src = currentBet.img;
            document.getElementById('titleBet').innerText = currentBet.name;
            document.getElementById('imgTarget').src = currentTarget.img;
            document.getElementById('titleTarget').innerText = currentTarget.name;

            let raw = (currentBet.val / currentTarget.val) * 85;
            chance = Math.min(95, Math.max(0.1, raw)).toFixed(2);
            document.getElementById('chanceNum').innerText = chance + '%';
            drawWheel();
        }

        const canvas = document.getElementById('wheelCanvas');
        const ctx = canvas.getContext('2d');

        function drawWheel() {
            ctx.clearRect(0, 0, 180, 180);
            const winAngle = (chance / 100) * 2 * Math.PI;
            ctx.beginPath(); ctx.moveTo(90, 90); ctx.arc(90, 90, 88, 0, winAngle); ctx.fillStyle = "#2ea043"; ctx.fill();
            ctx.beginPath(); ctx.moveTo(90, 90); ctx.arc(90, 90, 88, winAngle, 2 * Math.PI); ctx.fillStyle = "#da3633"; ctx.fill();
        }

        loadUserData();
        renderGrid();
        updateSlots();

        function startUpgradeProcess() {
            if(!document.getElementById('robloxNick').value) return alert("Введите Roblox ник!");
            document.getElementById('payModal').style.display = 'flex';
        }

        async function confirmPayment() {
            document.getElementById('payModal').style.display = 'none';
            alert("Заявка отправлена администратору!");
        }
    </script>
</body>
        </html>
