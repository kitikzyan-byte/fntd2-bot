<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FNTD 2 UPGRADER</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; user-select: none; }
        body { background: #0e1015; color: #fff; display: flex; flex-direction: column; align-items: center; padding: 12px; min-height: 100vh; overflow-x: hidden; }
        
        #authOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #0e1015; z-index: 1000; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
        .auth-card { background: #161a23; border: 2px solid #ffaa00; padding: 25px; border-radius: 14px; width: 100%; max-width: 360px; text-align: center; }
        .auth-input { width: 100%; background: #12151c; border: 1px solid #3a4454; color: #00ffcc; padding: 10px; border-radius: 8px; outline: none; margin: 15px 0; text-align: center; font-weight: bold; }

        .header { width: 100%; max-width: 420px; display: flex; justify-content: space-between; align-items: center; background: #161a23; border: 1px solid #2a313d; padding: 10px; border-radius: 12px; margin-bottom: 12px; }
        .nick-input { background: transparent; border: none; color: #00ffcc; font-weight: bold; font-size: 14px; outline: none; width: 60%; }
        .notif-btn { background: #2a313d; border: none; color: #fff; padding: 6px 12px; border-radius: 6px; cursor: pointer; position: relative; }
        .notif-badge { position: absolute; top: -5px; right: -5px; background: red; color: white; border-radius: 50%; padding: 2px 6px; font-size: 10px; display: none; }

        .souls-slider-box { width: 100%; max-width: 420px; background: #161b24; border: 1px solid #2ea043; padding: 10px; border-radius: 10px; margin-bottom: 12px; text-align: center; }
        .souls-slider-box input { width: 100%; accent-color: #00ffcc; cursor: pointer; margin-top: 5px; }

        .slots-wrapper { display: flex; gap: 10px; width: 100%; max-width: 420px; margin-bottom: 12px; }
        .slot-card { flex: 1; background: #161b24; border: 2px solid #2d3645; border-radius: 10px; padding: 8px; text-align: center; height: 110px; cursor: pointer; transition: 0.2s; }
        .slot-card.active-select { border-color: #ffaa00; background: #222938; }
        .slot-img { width: 45px; height: 45px; object-fit: contain; }
        .slot-name { font-size: 10px; font-weight: bold; margin-top: 4px; color: #ddd; }
        .slot-label { font-size: 9px; color: #aaa; text-transform: uppercase; margin-bottom: 4px; }

        .wheel-box { position: relative; width: 160px; height: 160px; margin: 10px 0; display: flex; align-items: center; justify-content: center; }
        .pointer-top { position: absolute; top: -8px; left: 50%; transform: translateX(-50%); border-left: 8px solid transparent; border-right: 8px solid transparent; border-top: 15px solid #ffcc00; z-index: 10; }
        canvas { border-radius: 50%; box-shadow: 0 0 20px rgba(0,0,0,0.8); }
        .chance-center { position: absolute; width: 50px; height: 50px; background: #0c0e12; border: 2px solid #ffcc00; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 13px; color: #fff; }
        
        .items-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; width: 100%; max-width: 420px; max-height: 150px; overflow-y: auto; background: #12151c; border: 1px solid #262c38; padding: 8px; border-radius: 10px; margin-bottom: 12px; }
        .grid-item { background: #181d26; border: 1px solid #2d3645; border-radius: 6px; padding: 6px; text-align: center; cursor: pointer; }
        .grid-item:active { border-color: #ffaa00; }
        .grid-item img { width: 35px; height: 35px; object-fit: contain; }
        .grid-item p { font-size: 8px; font-weight: bold; margin-top: 2px; color: #bbb; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .action-btn { width: 100%; max-width: 420px; padding: 14px; background: linear-gradient(180deg, #ffaa00 0%, #e67300 100%); border: none; border-radius: 8px; color: #000; font-size: 15px; font-weight: 900; cursor: pointer; }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); flex-direction: column; align-items: center; justify-content: center; z-index: 100; padding: 15px; text-align: center; }
        .modal-card { background: #161b24; border: 1px solid #2d3645; padding: 20px; border-radius: 12px; max-width: 380px; width: 100%; }
        
        #notifModal { justify-content: flex-start; padding-top: 50px; }
        .notif-list { width: 100%; max-height: 70vh; overflow-y: auto; text-align: left; margin-top: 15px; }
        .notif-item { background: #222938; padding: 10px; border-radius: 8px; margin-bottom: 10px; font-size: 12px; border-left: 4px solid #00ffcc; }
    </style>
</head>
<body>

    <div id="authOverlay">
        <div class="auth-card">
            <h2 style="color:#ffaa00;">FNTD 2 UPGRADER</h2>
            <p style="color:#aaa; font-size:12px; margin-top:10px;">Введите Roblox ник:</p>
            <input type="text" id="authNickInput" class="auth-input" placeholder="Ваш ник...">
            <button class="action-btn" onclick="submitAuthNick()">ВОЙТИ</button>
        </div>
    </div>

    <div class="header">
        <input type="text" id="robloxNick" class="nick-input" disabled>
        <button class="notif-btn" onclick="openNotif()">🔔 Уведомления <span class="notif-badge" id="notifBadge">0</span></button>
    </div>

    <div class="souls-slider-box">
        <label style="font-size:12px; color:#00ffcc; font-weight:bold;">Добавить Souls: <span id="soulsVal">0</span></label>
        <input type="range" id="soulsRange" min="0" max="4000" step="100" value="0" oninput="onSoulsSliderChange(this.value)">
    </div>

    <div class="slots-wrapper">
        <div class="slot-card active-select" id="slotBet" onclick="selectMode('bet')">
            <div class="slot-label">Ваша ставка</div>
            <img id="imgBet" class="slot-img">
            <div id="titleBet" class="slot-name"></div>
        </div>
        <div class="slot-card" id="slotTarget" onclick="selectMode('target')">
            <div class="slot-label">Вы получите</div>
            <img id="imgTarget" class="slot-img">
            <div id="titleTarget" class="slot-name"></div>
        </div>
    </div>

    <div class="wheel-box">
        <div class="pointer-top"></div>
        <div class="chance-center"><div id="chanceNum">0%</div></div>
        <canvas id="wheelCanvas" width="160" height="160"></canvas>
    </div>

    <div style="font-size: 11px; color:#7a8b9e; font-weight:bold; margin-bottom: 5px; text-transform:uppercase; max-width:420px; width:100%;">Список юнитов:</div>
    <div class="items-grid" id="itemsGrid"></div>

    <button class="action-btn" onclick="startUpgradeProcess()">СДЕЛАТЬ АПГРЕЙД</button>

    <!-- Модалки -->
    <div class="modal" id="payModal">
        <div class="modal-card">
            <h3 style="color:#ffaa00;">ПОЧТОВЫЙ ПЕРЕВОД</h3>
            <p style="color:#aaa; font-size:12px; margin: 10px 0;">ОТПРАВЬТЕ СТАВКУ ПО ПОЧТЕ ИГРОКУ</p>
            <div style="background:#000; color:#ffcc00; font-size:18px; font-weight:bold; padding:10px; border-radius:6px; margin-bottom:15px; border:1px solid #ffcc00;">fntd2UPGRADER</div>
            <button class="action-btn" onclick="confirmPaymentSent()">Я ОТПРАВИЛ!</button>
        </div>
    </div>

    <div class="modal" id="waitingModal">
        <div class="modal-card">
            <h3 style="color:#00ffcc;">ОЖИДАНИЕ...</h3>
            <p style="color:#aaa; font-size:12px; margin-top:10px;">Администратор проверяет почту.</p>
        </div>
    </div>

    <div class="modal" id="resultModal">
        <div class="modal-card" id="resultCard">
            <h2 id="resultTitle" style="font-size:20px; margin-bottom:10px;"></h2>
            <p id="resultText" style="color:#fff; font-size:14px; margin-bottom:20px;"></p>
            <button class="action-btn" onclick="closeResultModal()">ОК</button>
        </div>
    </div>

    <div class="modal" id="notifModal">
        <div class="modal-card" style="background: transparent; border: none;">
            <h2 style="color:#00ffcc; text-align:center;">УВЕДОМЛЕНИЯ</h2>
            <div class="notif-list" id="notifList"></div>
            <button class="action-btn" style="margin-top:20px;" onclick="closeNotif()">ЗАКРЫТЬ</button>
        </div>
    </div>

    <script>
        // ================== AUDIO ENGINE ==================
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function playTick() {
            if(audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle'; osc.frequency.setValueAtTime(800, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + 0.05);
        }

        function playWinSound() {
            if(audioCtx.state === 'suspended') audioCtx.resume();
            [440, 554, 659, 880].forEach((freq, i) => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine'; osc.frequency.value = freq;
                gain.gain.setValueAtTime(0, audioCtx.currentTime + i*0.1);
                gain.gain.linearRampToValueAtTime(0.2, audioCtx.currentTime + i*0.1 + 0.05);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + i*0.1 + 0.5);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(audioCtx.currentTime + i*0.1); osc.stop(audioCtx.currentTime + i*0.1 + 0.5);
            });
        }

        function playLoseSound() {
            if(audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(200, audioCtx.currentTime);
            osc.frequency.linearRampToValueAtTime(50, audioCtx.currentTime + 0.5);
            gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.001, audioCtx.currentTime + 0.5);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + 0.5);
        }

        // ================== LOGIC ==================
        const tg = window.Telegram.WebApp;
        tg.expand();
        const userId = tg.initDataUnsafe?.user?.id || Math.floor(Math.random() * 1000000);

        const UNITS_LIST = [
            { name: "Gaia Chica", val: 37000, img: "IMG_20260726_205154.jpg" },
            { name: "Headless Horseman Mangle", val: 27000, img: "IMG_20260726_205225.jpg" },
            { name: "Nature Reclaimed Foxy", val: 24000, img: "IMG_20260726_200917.jpg" },
            { name: "Candy Cadet", val: 18000, img: "IMG_20260726_204804.jpg" },
            { name: "Valkyrie Chica", val: 17000, img: "IMG_20260726_205432.jpg" },
            { name: "Lolbit", val: 17000, img: "IMG_20260726_204827.jpg" },
            { name: "Phone Dude", val: 17000, img: "IMG_20260726_204925.jpg" },
            { name: "Fathomeless Withered Foxy", val: 17000, img: "IMG_20260726_204529.jpg" },
            { name: "Deep Sea Calamity Endo", val: 4500, img: "IMG_20260726_204540.jpg" },
            { name: "Sole Survivor Withered Bonnie", val: 4500, img: "IMG_20260726_205253.jpg" },
            { name: "Afterbite Withered Golden Freddy", val: 2000, img: "IMG_20260726_192010.jpg" },
            { name: "Commander Withered Freddy", val: 2000, img: "IMG_20260726_204516.jpg" },
            { name: "UFO TANGLE", val: 2000, img: "IMG_20260726_205050.jpg" },
            { name: "Slasher Bonnie", val: 2000, img: "IMG_20260726_204738.jpg" },
            { name: "Rockin Bonnie", val: 2000, img: "IMG_20260726_204631.jpg" },
            { name: "Foxy EXE", val: 2000, img: "IMG_20260726_200932.jpg" },
            { name: "Helpy", val: 2000, img: "IMG_20260726_204815.jpg" }
        ];

        let selectionMode = 'bet'; // 'bet' or 'target'
        let currentBet = UNITS_LIST[UNITS_LIST.length - 1];
        let currentTarget = UNITS_LIST[0];
        let soulsBetVal = 0;
        let finalChance = 0;
        let statusPollInterval = null;
        let fetchNotifInterval = null;

        async function initApp() {
            try {
                const res = await fetch(`/api/user_info/${userId}`);
                const data = await res.json();
                if (data.nick) {
                    document.getElementById('robloxNick').value = data.nick;
                    document.getElementById('authOverlay').style.display = 'none';
                    checkNotifications();
                    fetchNotifInterval = setInterval(checkNotifications, 5000);
                }
            } catch(e) {}
        }
        initApp();

        function submitAuthNick() {
            const nick = document.getElementById('authNickInput').value.trim();
            if(!nick) return;
            document.getElementById('robloxNick').value = nick;
            document.getElementById('authOverlay').style.display = 'none';
            fetch(`/api/user_info/${userId}`, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ roblox_nick: nick }) });
            fetchNotifInterval = setInterval(checkNotifications, 5000);
        }

        function selectMode(mode) {
            selectionMode = mode;
            document.getElementById('slotBet').classList.remove('active-select');
            document.getElementById('slotTarget').classList.remove('active-select');
            if(mode === 'bet') document.getElementById('slotBet').classList.add('active-select');
            else document.getElementById('slotTarget').classList.add('active-select');
        }

        function onSoulsSliderChange(val) { soulsBetVal = parseInt(val); document.getElementById('soulsVal').innerText = soulsBetVal; updateSlots(); }

        function renderGrid() {
            const grid = document.getElementById('itemsGrid');
            grid.innerHTML = '';
            UNITS_LIST.forEach(item => {
                const card = document.createElement('div');
                card.className = 'grid-item';
                card.innerHTML = `<img src="${item.img}"><p>${item.name}</p>`;
                card.onclick = () => {
                    if(selectionMode === 'bet') currentBet = item;
                    else currentTarget = item;
                    updateSlots();
                };
                grid.appendChild(card);
            });
        }

        function updateSlots() {
            document.getElementById('imgBet').src = currentBet.img;
            document.getElementById('titleBet').innerText = currentBet.name;
            document.getElementById('imgTarget').src = currentTarget.img;
            document.getElementById('titleTarget').innerText = currentTarget.name;

            let totalBetVal = currentBet.val + soulsBetVal;
            let raw = (totalBetVal / currentTarget.val) * 70;
            finalChance = Math.min(70, Math.max(0.1, raw)).toFixed(2);
            document.getElementById('chanceNum').innerText = finalChance + '%';
            drawWheel(0);
        }

        const canvas = document.getElementById('wheelCanvas');
        const ctx = canvas.getContext('2d');

        function drawWheel(angleOffset = 0) {
            ctx.clearRect(0, 0, 160, 160);
            const winAngle = (finalChance / 100) * 2 * Math.PI;
            ctx.save();
            ctx.translate(80, 80);
            ctx.rotate(angleOffset);
            
            // Зеленая зона (Победа)
            ctx.beginPath(); ctx.moveTo(0, 0); ctx.arc(0, 0, 78, 0, winAngle); ctx.fillStyle = "#2ea043"; ctx.fill();
            // Красная зона (Поражение)
            ctx.beginPath(); ctx.moveTo(0, 0); ctx.arc(0, 0, 78, winAngle, 2 * Math.PI); ctx.fillStyle = "#da3633"; ctx.fill();
            
            ctx.restore();
        }

        renderGrid(); updateSlots();

        function startUpgradeProcess() { document.getElementById('payModal').style.display = 'flex'; }

        async function confirmPaymentSent() {
            document.getElementById('payModal').style.display = 'none';
            document.getElementById('waitingModal').style.display = 'flex';

            const nick = document.getElementById('robloxNick').value;
            let betDesc = currentBet.name + (soulsBetVal > 0 ? ` + ${soulsBetVal} Souls` : "");

            await fetch('/api/submit_upgrade', {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ user_id: userId, roblox_nick: nick, bet_info: betDesc, target_info: currentTarget.name, chance: finalChance })
            });
            statusPollInterval = setInterval(checkAdminStatus, 3000);
        }

        async function checkAdminStatus() {
            try {
                const res = await fetch(`/api/check_status/${userId}`);
                const data = await res.json();
                
                if (data.status === 'approved_win' || data.status === 'approved_lose' || data.status === 'rejected') {
                    clearInterval(statusPollInterval);
                    document.getElementById('waitingModal').style.display = 'none';
                    
                    if (data.status === 'rejected') {
                        showResult(false, "Отклонено", "Администратор отменил ставку.");
                        return;
                    }
                    
                    const isWin = (data.status === 'approved_win');
                    runSpinAnimation(isWin);
                }
            } catch(e) {}
        }

        function runSpinAnimation(isWin) {
            if(audioCtx.state === 'suspended') audioCtx.resume();
            
            // Расчет угла остановки честно:
            // winAngle = (finalChance / 100) * 360 градусов.
            // Если победа, останавливаемся между 360 - winAngle и 360 (чтобы верхний поинтер был в зеленой зоне).
            // Если проигрыш, останавливаемся в остальной части.
            
            const winAngleDeg = (finalChance / 100) * 360;
            let targetStopAngleDeg;
            
            if(isWin) {
                // Случайный угол в зеленой зоне (колесо повернуто так, что 0 градусов - это правая сторона)
                // Сдвиг -90 градусов нужен, потому что стрелка сверху (270 градусов).
                targetStopAngleDeg = 270 - (Math.random() * winAngleDeg);
            } else {
                // Случайный угол в красной зоне
                targetStopAngleDeg = 270 - winAngleDeg - (Math.random() * (360 - winAngleDeg));
            }
            
            // Добавляем 5 полных оборотов
            const totalRotationDeg = (360 * 5) + targetStopAngleDeg;
            const totalRotationRad = totalRotationDeg * (Math.PI / 180);
            
            let currentAngle = 0;
            let speed = 0.8;
            let lastTickAngle = 0;
            
            function animate() {
                if (currentAngle < totalRotationRad) {
                    currentAngle += speed;
                    // Замедление
                    const progress = currentAngle / totalRotationRad;
                    speed = Math.max(0.005,
